name: Release

# This workflow runs when a new GitHub release is published
# It builds the project, attaches schema files to the release,
# and publishes the package to both npm and GitHub Packages

on:
  release:
    types: [published]

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to upload assets to the release
      packages: write # Needed to publish to GitHub Packages
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          bun-version: latest
          registries: |
            @durkinza:https://npm.pkg.github.com/|$GITHUB_TOKEN
      
      - name: Install dependencies
        env:
          BUN_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun ci

      - name: Set version from release tag
        id: set_version
        run: |
          VERSION=$(echo ${{ github.ref_name }})
          if [[ "${{ github.event.release.prerelease }}" == "true" ]]; then
            VERSION="$VERSION-beta"
          fi
          echo "Setting package version to $VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          jq ".version = \"$VERSION\"" package.json > package.json.tmp
          mv package.json.tmp package.json

      - name: Build
        run: bun run build

      - name: Upload schema files to release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            challenge.schema.json
            challenge-pack.schema.json
          token: ${{ secrets.GITHUB_TOKEN }}
    

      # - name: Publish to NPM with standard tag
      #   run: bun publish --tag ${{ steps.set_version.outputs.VERSION }}
      #   env:
      #     NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to GitHub Packages
        run: bun publish --access restricted --ignore-scripts --tag ${{ steps.set_version.outputs.VERSION }}
        env:
          BUN_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
